/* no text selection, long-press menus or image dragging (typing fields stay normal) */

.vwr .fpn b{font-size:1rem}.vwr .fpn span{font-size:.84rem}.vwr .fpn .vwy{align-self:flex-start;margin-top:.25rem;font:700 .7rem/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--gd);background:color-mix(in srgb,var(--ac) 16%,transparent);padding:.25rem .5rem;border-radius:99px}
.vwf{flex:none;background:var(--ac);color:var(--on);border:0;border-radius:999px;padding:.5rem 1.05rem;font-weight:700;font-size:.88rem}.vwf.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}

/* feed: article without a photo = clean gradient, centred heading + short description */
.fs.nt .fc:before{background:linear-gradient(#0003,transparent)}.fs.nt:after,.fs.nt .fc:after{inset:52% 0 0;background:linear-gradient(transparent,#0008)}.fs.nt .fi .ft{display:none}.fs.nt .fbg>.pst{padding-bottom:10.5rem}.fs.nt .pstt{-webkit-line-clamp:5;font-weight:800}
.fbg>.pst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;container-type:inline-size;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 4.5rem) 2.6rem 8rem 1.6rem;color:#fff;background:radial-gradient(120% 65% at 85% 0,color-mix(in srgb,var(--cc) 66%,#fff) 0,transparent 62%),radial-gradient(100% 60% at 0 100%,color-mix(in srgb,var(--cc) 62%,#000) 0,transparent 72%),linear-gradient(165deg,color-mix(in srgb,var(--cc) 92%,#fff),color-mix(in srgb,var(--cc) 70%,#000))}
.pst>a{display:flex;flex-direction:column;align-items:center;gap:1rem;color:#fff;pointer-events:auto;max-width:100%}

.pstd{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font:400 1.05rem/1.45 "Source Serif 4",Georgia,serif;max-width:30ch;color:#ffffffd9;text-wrap:balance}

/* text covers keep the exact height of photo covers inside article cards (no stretched neighbours) */

/* ---- v5.1.48: heading sits in a thin-bordered card; it shrinks with the picture when comments open ---- */
.fs.nt .pst>a{width:fit-content;max-width:100%;padding:calc(1.5rem*(1 - .45*var(--shr,0))) calc(1.6rem*(1 - .45*var(--shr,0)));border:1px solid #ffffff4d;border-radius:24px;background:#ffffff14;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 8px 30px #0003;transition:padding .3s cubic-bezier(.2,.8,.2,1)}
.fs.nt .fbg>.pst{padding:calc((env(safe-area-inset-top,0px) + 4.5rem)*(1 - var(--shr,0)) + .9rem*var(--shr,0)) calc(2.6rem*(1 - var(--shr,0)) + 1rem*var(--shr,0)) calc(10.5rem*(1 - var(--shr,0)) + .9rem*var(--shr,0)) calc(1.6rem*(1 - var(--shr,0)) + 1rem*var(--shr,0));transition:padding .3s cubic-bezier(.2,.8,.2,1)}
.fs.nt .pstt{font-size:calc(min(calc(var(--k)*1cqw),3.4rem)*(1 - .5*var(--shr,0)));transition:font-size .3s cubic-bezier(.2,.8,.2,1)}
.fbg.fdr>.pst,.fbg.fdr .pst>a,.fbg.fdr .pstt{transition:none!important}

/* ---- v5.1.49: modern poster cards, whole-word wrapping, gradient covers in the Articles list ---- */
.pstt{overflow-wrap:break-word;word-break:normal;hyphens:manual}
.nb{white-space:nowrap}
.fs .fb2{-webkit-line-clamp:3}
.fbg>.pst{background:radial-gradient(70% 50% at 12% 8%,color-mix(in oklab,var(--cc) 55%,#ff8ad8) 0,transparent 62%),radial-gradient(65% 50% at 95% 28%,color-mix(in oklab,var(--cc) 58%,#4fe3ff) 0,transparent 64%),radial-gradient(90% 60% at 15% 100%,color-mix(in oklab,var(--cc) 50%,#12002b) 0,transparent 72%),linear-gradient(165deg,color-mix(in oklab,var(--cc) 90%,#fff),color-mix(in oklab,var(--cc) 52%,#000))}
.pste{position:absolute;right:-1.5rem;bottom:14%;font-style:normal;font-size:15rem;line-height:1;opacity:.1;transform:rotate(-12deg);pointer-events:none;filter:blur(1px)}
.fs.nt .pst>a{border-radius:30px;border:1px solid #ffffff52;background:linear-gradient(160deg,#ffffff26,#ffffff0d);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 14px 44px #0004,inset 0 1px 0 #ffffff45}
.cv.tc{background:linear-gradient(135deg,color-mix(in oklab,var(--cc) 62%,#ff9bd6) 0%,var(--cc) 42%,color-mix(in oklab,var(--cc) 52%,#12002b) 100%)}
.cv.tc:before{background:radial-gradient(90% 80% at 100% 0,#ffffff3d,transparent 55%)}
.cv.tc1{background:linear-gradient(200deg,color-mix(in oklab,var(--cc) 60%,#7affd9) 0%,var(--cc) 45%,color-mix(in oklab,var(--cc) 50%,#06142b) 100%)}
.cv.tc1:before{background:radial-gradient(90% 90% at 0 100%,#ffffff33,transparent 55%)}
.cv.tc2{background:linear-gradient(160deg,color-mix(in oklab,var(--cc) 58%,#ffd36e) 0%,var(--cc) 48%,color-mix(in oklab,var(--cc) 50%,#220010) 100%)}
.cv.tc2:before{background:radial-gradient(90% 100% at 50% 120%,#ffffff33,transparent 60%)}

/* ---- v5.1.50: thin line-art category icons behind the cards (replaces emoji) ---- */
.pste{right:-3.5rem;bottom:10%;width:min(80%,23rem);aspect-ratio:1;font-size:0;line-height:0;opacity:1;filter:none;transform:rotate(-10deg);color:#fff;-webkit-mask-image:linear-gradient(205deg,#000 0,#000a 40%,#0000 82%);mask-image:linear-gradient(205deg,#000 0,#000a 40%,#0000 82%)}

.pste:before{inset:-12%}.pste:after{inset:-28%;border-color:#ffffff14}
.tce{font-size:0;line-height:0;opacity:1;color:#fff;transform:rotate(-8deg)}
.tce svg{display:block;width:min(46cqw,13rem);height:min(46cqw,13rem);stroke-width:.6;opacity:.28;filter:drop-shadow(0 0 14px #ffffff40)}
.tc .tce{right:-5%;bottom:-26%}.tc .tce svg{width:6.6rem;height:6.6rem;stroke-width:.7}

/* ===== v5.1.52: profile article cards ===== */
.pf-g.pa{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px 12px}
.atl{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:4/5;border-radius:16px;overflow:hidden;color:#fff;text-align:left;container-type:inline-size;transition:transform .15s;background:radial-gradient(120% 65% at 85% 0,color-mix(in srgb,var(--cc) 66%,#fff) 0,transparent 62%),linear-gradient(165deg,color-mix(in srgb,var(--cc) 92%,#fff),color-mix(in srgb,var(--cc) 66%,#000))}
.atl:active{transform:scale(.98)}
.atl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}

.att{position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:0 .8rem;font:800 .98rem/1.18 "Bricolage Grotesque",system-ui,sans-serif;text-shadow:0 1px 10px #0006;overflow-wrap:anywhere}
.atm{position:relative;z-index:1;display:flex;align-items:center;gap:.3rem;padding:.45rem .8rem .75rem;font:700 .75rem/1 "Bricolage Grotesque",system-ui,sans-serif;opacity:.92}.atm svg{flex:none}.atm i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;margin:0 .15rem}
.atl.np{justify-content:center;align-items:center;text-align:center}
.atl.pin .atp{max-width:calc(100% - 5.2rem)}

.atl.np .atm{position:absolute;left:0;right:0;bottom:0;justify-content:center}

/* ===== v5.1.54: modern notifications, errors and photo reordering ===== */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + .7rem);bottom:auto!important;width:max-content;max-width:min(92vw,440px);box-sizing:border-box;display:flex!important;align-items:center;gap:.7rem;padding:.65rem .7rem .65rem .65rem;border-radius:18px;background:#151515;color:#fff;border:1px solid #ffffff1f;box-shadow:0 14px 34px #000a,0 2px 8px #0006;font:600 .92rem/1.35 "Bricolage Grotesque",system-ui,sans-serif;text-align:left;overflow:hidden;opacity:0;pointer-events:none;transform:translate(-50%,-18px) scale(.97);transition:opacity .2s,transform .32s cubic-bezier(.2,.9,.3,1.25);z-index:9999}
#toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.tic{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}

.tst.err{border-color:#ff6b7066;background:linear-gradient(90deg,#ff6b7024,transparent 55%),#151515}
.tst.err.show .tic{animation:twob .5s}
.tmsg{flex:1;min-width:0;overflow-wrap:anywhere}
.tcl{flex:none;background:none;border:0;color:#ffffff8c;padding:.35rem;line-height:0;border-radius:50%}.tcl:hover{background:#ffffff18;color:#fff}
.tbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c);opacity:.55;transform-origin:left;animation:tbar linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes twob{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.tsp{width:20px;height:20px;border:3px solid color-mix(in srgb,currentColor 22%,transparent);border-top-color:currentColor;border-radius:50%;animation:tspin .7s linear infinite;display:block}
@keyframes tspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#toast,.tst.err.show .tic{transition:opacity .2s;animation:none}.tbar{animation:none}}
/* inline form errors */

const SEEDS=[{"cat": "Tech News", "title": "Akili bandia (AI) inavyobadilisha kazi na biashara", "body": "Akili bandia (AI) haipo tena kwenye maabara pekee. Leo inatumika kuandika ujumbe, kutafsiri lugha, kuchambua takwimu na hata kusaidia madaktari kusoma picha za vipimo. Kampuni nyingi ndogo na kubwa zinajaribu zana za AI ili kupunguza kazi za kujirudia rudia.\n\n# Mabadiliko yanayoonekana\n- Huduma kwa wateja: majibu ya haraka ya mazungumzo (chatbot) saa 24.\n- Masoko: kuandaa rasimu za matangazo na machapisho kwa muda mfupi.\n- Uchambuzi: kupata mwelekeo ndani ya takwimu nyingi bila kuchambua kwa mkono.\n\n# Tahadhari\nAI inaweza kukosea au kutoa taarifa zisizo sahihi kwa kujiamini. Kila kazi muhimu inapaswa kukaguliwa na binadamu kabla ya kutumika. Epuka pia kuweka taarifa za siri za kampuni au za wateja kwenye zana usizozielewa vizuri.\n\nKwa wanafunzi na wafanyakazi, ujuzi wa kutumia AI kwa busara unakuwa faida kubwa kazini. Anza kwa kujaribu kazi ndogo ndogo, kisha ongeza hatua kwa hatua."}, {"cat": "Tech News", "title": "Mtandao wa 5G: unabadilisha nini na utafika lini kwa wengi?", "body": "5G ni kizazi cha tano cha mitandao ya simu. Ahadi yake kuu ni kasi kubwa zaidi, ucheleweshaji (latency) mdogo sana, na uwezo wa kuhudumia vifaa vingi kwa wakati mmoja.\n\n# Faida zinazotarajiwa\n- Kupakua video na michezo kwa haraka zaidi.\n- Mikutano ya video yenye ubora bora.\n- Vifaa janja vingi (IoT) kwenye viwanda, kilimo na miji.\n\n# Hali ilivyo\nUpatikanaji wa 5G unatofautiana sana kati ya nchi na hata kati ya miji. Maeneo mengi bado yanategemea 4G, na kwa watumiaji wengi 4G yenye mtandao imara inatosha kwa mahitaji ya kila siku. Ili kutumia 5G unahitaji simu inayoiunga mkono, pamoja na mnara wa mtoa huduma wako kuwa umewashwa 5G eneo ulipo.\n\nKabla ya kununua simu kwa sababu ya 5G pekee, hakikisha kwanza huduma hiyo ipo eneo unaloishi."}, {"cat": "Tech News", "title": "Pesa za simu zinavyoendelea kubadilisha biashara Afrika Mashariki", "body": "Afrika Mashariki ni miongoni mwa maeneo yaliyoongoza duniani kwa matumizi ya pesa za simu. Huduma kama M-Pesa, Tigo Pesa, Airtel Money na nyinginezo zimewezesha watu wengi kutuma, kupokea na kuhifadhi pesa bila akaunti ya benki.\n\n# Nini kimebadilika\n- Wafanyabiashara wadogo wanapokea malipo kwa simu bila kushika pesa taslimu.\n- Mikopo midogo na bima zinapatikana kupitia simu.\n- Malipo ya bili kama umeme na maji yamerahisishwa.\n\n# Changamoto\nUlaghai kwa njia ya simu, ada za miamala na kukatika kwa mtandao bado ni changamoto. Usishiriki PIN yako na mtu yeyote, na thibitisha kila ujumbe wa kuomba pesa kabla ya kutuma.\n\nMwelekeo unaofuata ni kuunganisha huduma hizi na benki, malipo ya kimataifa na biashara za mtandaoni."}, {"cat": "Tech News", "title": "Intaneti ya satelaiti: je, inaweza kufika kila mahali?", "body": "Intaneti ya satelaiti hutumia satelaiti zinazozunguka dunia kupeleka mtandao moja kwa moja kwenye kifaa maalum nyumbani au ofisini. Huduma kama Starlink zimefanya wazo hili kuwa maarufu zaidi kwa sababu satelaiti zake ziko karibu zaidi na dunia kuliko za zamani, hivyo ucheleweshaji ni mdogo.\n\n# Nani anafaidika\nMaeneo ya vijijini, visiwani na kwingineko ambako minara na nyaya za fibre hazijafika.\n\n# Mambo ya kuzingatia\n- Upatikanaji hutegemea leseni na sheria za kila nchi.\n- Vifaa na ada za kila mwezi vinaweza kuwa ghali kuliko mitandao ya kawaida.\n- Hali ya hewa kali na vizuizi kama miti mikubwa vinaweza kuathiri ubora.\n\nKwa maeneo yenye fibre au 4G imara, satelaiti si lazima. Lakini kwa maeneo yasiyofikika, ni suluhisho la kweli linaloweza kufungua fursa za elimu, afya na biashara."}, {"cat": "Tech News", "title": "Kompyuta za AI (AI PC): ni nini na zina umuhimu gani?", "body": "Kompyuta za AI ni laptop na kompyuta zinazokuja na chipu maalum ya kuendesha kazi za akili bandia moja kwa moja kwenye kifaa, mara nyingi huitwa NPU (Neural Processing Unit). Tofauti na kutegemea mtandao, kazi nyingi hufanyika ndani ya kompyuta yenyewe.\n\n# Faida\n- Faragha zaidi kwa sababu taarifa nyingi hazitoki kwenye kifaa.\n- Kazi kama kuondoa kelele kwenye simu za video au kutambua sauti hufanyika haraka bila kuchosha betri.\n- Baadhi ya kazi zinaweza kufanya kazi hata bila mtandao.\n\n# Je, unahitaji moja?\nKama unatumia kompyuta kwa kazi za kawaida kama kuandika, kuvinjari na barua pepe, huhitaji kukimbilia kununua. Ukihitaji kununua laptop mpya, kuchagua yenye NPU ni njia nzuri ya kujiandaa na programu za miaka ijayo."}, {"cat": "Tech News", "title": "Nishati ya jua inavyowezesha teknolojia vijijini", "body": "Mamilioni ya watu Afrika bado hawajaunganishwa kwenye gridi ya umeme, lakini simu za mkononi zimefika karibu kila mahali. Nishati ya jua imesaidia kuziba pengo hili: paneli ndogo, betri na taa za LED sasa ni nafuu zaidi kuliko zamani.\n\n# Matumizi ya kila siku\n- Kuchaji simu na redio.\n- Taa za nyumbani na za biashara ndogo.\n- Mifumo ya kulipia kidogo kidogo (pay-as-you-go) inayomwezesha mteja kulipa kwa awamu.\n\n# Athari\nWatoto wanasoma usiku, wafanyabiashara wanafungua duka kwa muda mrefu, na zahanati zinahifadhi chanjo kwenye majokofu yanayotumia jua. Teknolojia hii inaonyesha kuwa maendeleo ya kidijitali hayasubiri gridi pekee.\n\nUkinunua mfumo wa jua, chagua bidhaa zenye dhamana na uulize kuhusu muda wa maisha wa betri."}, {"cat": "Tech News", "title": "Ulaghai wa kutumia AI: sauti na video bandia (deepfake)", "body": "Teknolojia ya deepfake inaweza kuiga sauti na sura ya mtu kwa ufanisi mkubwa. Wahalifu wameanza kuitumia kutuma ujumbe wa sauti unaofanana na wa ndugu, bosi au kiongozi wakiomba pesa haraka.\n\n# Jinsi ya kujikinga\n- Piga simu ya kawaida kwa namba unayoijua ili kuthibitisha ombi lolote la pesa.\n- Kubaliana na familia kuhusu neno la siri la dharura.\n- Kuwa mwangalifu na video au sauti zinazoamsha hasira au hofu ghafla.\n- Usitume pesa kwa shinikizo la \"haraka sana\".\n\n# Ishara za kuangalia\nMidomo isiyolingana na sauti, mwanga usio wa kawaida usoni, au lafudhi inayobadilikabadilika.\n\nKumbuka: kuthibitisha kunagharimu dakika chache tu, lakini kuhadaiwa kunaweza kugharimu pesa nyingi."}, {"cat": "Tech News", "title": "Magari ya umeme: mwelekeo wa dunia na fursa kwa Afrika", "body": "Magari ya umeme (EV) yanaongezeka duniani kote kwa sababu ya gharama ndogo za uendeshaji, matengenezo machache na kupunguza uchafuzi wa hewa. Nchi nyingi zinaweka malengo ya kupunguza magari ya petroli na dizeli kwa miaka ijayo.\n\n# Hali Afrika Mashariki\nMatumizi bado ni madogo, lakini pikipiki na baiskeli za umeme (bodaboda) ni miongoni mwa fursa zinazokua kwa kasi kwa sababu zinapunguza gharama za mafuta.\n\n# Changamoto kuu\n- Upatikanaji wa vituo vya kuchaji.\n- Gharama ya awali ya betri.\n- Uhakika wa umeme.\n\n# Fursa\nBiashara za kuchaji betri, kubadilisha betri (battery swap), matengenezo na umeme wa jua kwa ajili ya vituo vya kuchaji. Wajasiriamali wa teknolojia wana nafasi ya kuingia mapema."}, {"cat": "Tech News", "title": "Sheria za ulinzi wa taarifa binafsi: unachopaswa kujua", "body": "Nchi nyingi, zikiwemo za Afrika Mashariki, zimetunga sheria za kulinda taarifa binafsi za wananchi. Lengo ni kuhakikisha kampuni na taasisi zinakusanya, kuhifadhi na kutumia taarifa zako kwa uwazi na kwa idhini yako.\n\n# Haki zako za msingi\n- Kujua taarifa gani zinakusanywa kuhusu wewe na kwa sababu gani.\n- Kuomba zisahihishwe taarifa zisizo sahihi.\n- Kuomba taarifa zako zifutwe pale inapofaa kisheria.\n\n# Kwa biashara\nKama unamiliki duka la mtandaoni au programu, hifadhi taarifa za wateja kwa usalama, kusanya zile tu unazozihitaji, na uwe na sera ya faragha inayoeleweka.\n\nSheria na kanuni hutofautiana kati ya nchi, hivyo soma sheria ya nchi yako au mwulize mshauri wa kisheria kabla ya kukusanya taarifa nyingi za watu."}, {"cat": "Tech News", "title": "Vifaa vya kuvaa na afya: kuelekea ufuatiliaji wa kila siku", "body": "Saa janja na bendi za mazoezi zimehama kutoka kuhesabu hatua tu hadi kufuatilia mapigo ya moyo, usingizi na viwango vya mazoezi. Kampuni zinaendelea kuongeza vipengele vya afya kwenye vifaa hivi.\n\n# Vinavyopatikana mara nyingi\n- Kipimo cha mapigo ya moyo.\n- Ufuatiliaji wa usingizi.\n- Kipimo cha oksijeni kwenye damu (kwa baadhi ya vifaa).\n- Arifa za kukumbusha kusimama na kutembea.\n\n# Tahadhari muhimu\nVifaa hivi si vya kutambua magonjwa. Vipimo vyake vinaweza kutofautiana na vya hospitali. Vitumie kama mwongozo wa mwenendo wa afya yako, na umwone daktari ukiona dalili zisizo za kawaida.\n\nFikiria pia faragha: taarifa za afya ni nyeti, hivyo kagua ruhusa za programu ya kifaa chako."}, {"cat": "Gadgets & Reviews", "title": "Mwongozo: jinsi ya kuchagua simu janja ya bei ya kati", "body": "Soko lina simu nyingi za bei ya kati, na kuchagua kunaweza kuchanganya. Badala ya kuangalia jina la chapa pekee, angalia mambo haya muhimu.\n\n# 1. Betri na kuchaji\nBetri ya angalau 5000 mAh kwa kawaida hudumu siku nzima kwa matumizi ya kawaida. Kasi ya kuchaji (W) inaamua unasubiri kwa muda gani.\n\n# 2. Kichakataji na RAM\nRAM ya 6GB au zaidi na kichakataji cha kisasa hufanya simu iendelee kuwa na kasi kwa miaka mingi.\n\n# 3. Skrini\nSkrini ya AMOLED ina rangi nzuri na huokoa betri. Kiwango cha 90Hz au 120Hz hufanya kusogeza (scroll) kuwa laini.\n\n# 4. Masasisho ya programu\nUliza simu itapata masasisho ya usalama kwa muda gani. Hili ni muhimu kuliko megapikseli.\n\n# Hukumu\nChagua simu yenye betri nzuri, hifadhi ya kutosha (angalau 128GB) na masasisho ya muda mrefu. Soma ukaguzi wa mtu halisi aliyeitumia kabla ya kununua."}, {"cat": "Gadgets & Reviews", "title": "Kamera ya simu: usidanganywe na megapikseli", "body": "Simu yenye kamera ya 108MP haimaanishi picha bora kuliko ya 12MP. Ubora wa picha hutegemea mambo mengi zaidi.\n\n# Vinavyoleta tofauti halisi\n- Ukubwa wa sensa: sensa kubwa hukusanya mwanga zaidi, hasa usiku.\n- Lenzi na kipenyo (aperture): namba ndogo kama f/1.8 humaanisha mwanga zaidi.\n- Uimarishaji wa picha (OIS): hupunguza picha zinazotikisika.\n- Programu ya usindikaji: ndiyo inayoamua rangi na ukali wa picha.\n\n# Jinsi ya kujaribu kabla ya kununua\nPiga picha ndani ya chumba chenye mwanga hafifu, piga picha ya mtu aliye mbele ya dirisha, na rekodi video ukitembea. Linganisha na simu nyingine.\n\n# Hukumu\nTazama sampuli za picha halisi kutoka kwenye ukaguzi, si picha za matangazo. Kamera nzuri ya 50MP yenye sensa kubwa mara nyingi huzishinda kamera za megapikseli nyingi zenye sensa ndogo."}, {"cat": "Gadgets & Reviews", "title": "Power bank: uwezo, kasi na usalama", "body": "Power bank ni kifaa muhimu hasa pale umeme unapokatika au unaposafiri. Lakini si zote ni sawa.\n\n# Uwezo (mAh)\nPower bank ya 10,000 mAh huchaji simu ya kawaida takriban mara mbili. Ya 20,000 mAh hufaa kwa safari ndefu, ingawa ni nzito zaidi. Kumbuka kuwa uwezo halisi huwa chini ya ule ulioandikwa kwa sababu ya upotevu wakati wa kubadilisha volteji.\n\n# Kasi ya kuchaji\nTafuta zinazounga mkono kuchaji haraka (kama PD au QC) ikiwa simu yako inaunga mkono.\n\n# Usalama\n- Nunua chapa inayojulikana yenye ulinzi dhidi ya joto kali na mzunguko mfupi.\n- Epuka power bank za bei ya chini isiyo ya kawaida, kwani zinaweza kuwa na uwezo wa uongo.\n\n# Hukumu\nKwa matumizi ya kila siku, 10,000 mAh yenye kuchaji haraka ndiyo uwiano bora wa uzito na uwezo."}, {"cat": "Gadgets & Reviews", "title": "Earbuds za Bluetooth: vipi vya kuchagua?", "body": "Vifaa vya masikioni visivyotumia waya vimekuwa maarufu, lakini ubora hutofautiana sana. Hivi ndivyo vya kuzingatia.\n\n# Ubora wa sauti\nSikiliza kabla ya kununua kama inawezekana. Sauti bora ina besi inayodhibitiwa, sauti za kati zilizo wazi na treble isiyokera.\n\n# Betri\nAngalia muda wa earbuds peke yake na pamoja na kasha la kuchaji. Saa 5 hadi 8 kwa chaji moja ni kiwango kizuri.\n\n# Kupunguza kelele (ANC)\nInafaa kwenye daladala, ndege au ofisi yenye kelele. Hata hivyo, huongeza bei.\n\n# Maikrofoni\nIkiwa unapiga simu mara nyingi, jaribu ubora wa maikrofoni.\n\n# Hukumu\nKwa bajeti ndogo, chagua chapa inayoaminika yenye betri nzuri na uunganishaji thabiti. ANC iachwe kwa wanaoihitaji kweli."}, {"cat": "Gadgets & Reviews", "title": "Laptop ya mwanafunzi: RAM, SSD na kichakataji unachohitaji", "body": "Mwanafunzi hahitaji laptop ya bei kubwa sana, lakini anahitaji ya kuaminika. Mambo haya matatu yanaamua kasi na uimara wake.\n\n# RAM\n8GB ni kiwango cha chini kinachofaa kwa kuvinjari, kuandika na programu za ofisi. 16GB inafaa ukifanya programu, usanifu au kufungua vitu vingi kwa pamoja.\n\n# Hifadhi\nChagua SSD badala ya HDD. SSD huwasha kompyuta kwa sekunde chache na hufungua programu haraka zaidi. 256GB inatosha kuanzia, 512GB ni bora.\n\n# Kichakataji\nKichakataji cha kisasa cha kiwango cha kati (kama Core i5, Ryzen 5 au sawa nacho) kinatosha kwa kazi nyingi za shule.\n\n# Mengine ya kuangalia\n- Betri inayodumu angalau saa 6.\n- Kibodi ya kuandika kwa starehe.\n- Uzito mwepesi kwa kubeba kila siku.\n\n# Hukumu\n8GB RAM, SSD ya 256GB na kichakataji cha kati ni mchanganyiko bora wa bei na ubora kwa mwanafunzi."}, {"cat": "Gadgets & Reviews", "title": "Saa janja au bendi ya mazoezi: ipi inakufaa?", "body": "Saa janja na bendi za mazoezi zinafanana kwa kuonekana, lakini zina tofauti muhimu.\n\n# Bendi ya mazoezi\n- Bei nafuu zaidi.\n- Betri hudumu wiki moja au zaidi.\n- Hufuatilia hatua, mapigo ya moyo na usingizi.\n\n# Saa janja\n- Ina skrini kubwa na programu zaidi.\n- Unaweza kupokea simu na ujumbe, na baadhi zina GPS na malipo.\n- Betri hudumu siku moja hadi chache.\n\n# Jiulize\nJe, unataka kufuatilia mazoezi tu, au unataka kifaa chenye kila kitu mkononi? Je, unaweza kuvumilia kuchaji kila siku?\n\n# Hukumu\nKama lengo ni afya na mazoezi kwa bajeti ndogo, bendi inatosha. Kama unataka arifa, programu na GPS, saa janja ni chaguo bora. Hakikisha inaendana na simu yako (Android au iPhone)."}, {"cat": "Gadgets & Reviews", "title": "Router ya WiFi: jinsi ya kuchagua na kuiweka vizuri", "body": "Intaneti polepole nyumbani mara nyingi si tatizo la mtoa huduma bali la router au mahali ilipowekwa.\n\n# Mambo ya kuchagua\n- WiFi 5 (ac) ni ya kawaida na inatosha; WiFi 6 ni bora kwa vifaa vingi kwa wakati mmoja.\n- Bendi mbili (2.4GHz na 5GHz): 5GHz ni ya kasi, 2.4GHz hufika mbali zaidi.\n- Nguvu ya mawimbi inayotosha ukubwa wa nyumba yako.\n\n# Mahali pa kuiweka\n- Katikati ya nyumba, juu kidogo.\n- Mbali na kuta nene, microwave na vifaa vya sumaku.\n\n# Usalama\nBadilisha nenosiri la msingi la router na tumia usimbaji wa WPA2 au WPA3.\n\n# Hukumu\nKwa nyumba ya kawaida, router ya WiFi 5 au 6 yenye bendi mbili iliyowekwa vizuri inatosha kabisa. Router kubwa na ghali haisaidii ikiwa imewekwa kwenye kona."}, {"cat": "Gadgets & Reviews", "title": "TV janja: ukubwa, paneli na mfumo wa kuchagua", "body": "Kununua TV janja ni uwekezaji wa miaka mingi, hivyo chukua muda kuchagua.\n\n# Ukubwa kulingana na umbali\nKanuni rahisi: kadiri unavyokaa mbali, ndivyo TV inavyopaswa kuwa kubwa. Kwa umbali wa mita 2 hadi 3, inchi 43 hadi 55 hufaa wengi.\n\n# Azimio\n4K ni kiwango cha sasa na linafaa kwa TV nyingi zaidi ya inchi 40.\n\n# Aina ya paneli\n- LED/LCD: bei nafuu, mwanga mzuri sebuleni.\n- OLED: rangi nyeusi kamilifu na rangi bora, lakini ghali.\n\n# Mfumo wa programu\nChagua mfumo unaopata masasisho na una programu unazozitumia kama YouTube na huduma za video.\n\n# Hukumu\nTV ya 4K ya ukubwa unaofaa chumba chako ni chaguo bora kuliko TV kubwa sana ya ubora mdogo. Pima chumba kabla ya kununua."}, {"cat": "Gadgets & Reviews", "title": "Spika za Bluetooth: ubora wa sauti na uimara", "body": "Spika ya Bluetooth inafaa kwa sherehe ndogo, ufukweni au nyumbani. Kabla ya kununua, zingatia haya.\n\n# Ubora wa sauti\nSpika kubwa kwa kawaida hutoa besi bora. Sauti isiyopasuka wakati wa sauti kubwa ni ishara ya ubora.\n\n# Uimara na maji\nAngalia kiwango cha IP kama IPX5 au IP67; kinaonyesha upinzani dhidi ya maji na vumbi.\n\n# Betri\nSaa 8 hadi 12 ni kiwango kizuri. Spika zenye uwezo mkubwa zinaweza pia kuchaji simu.\n\n# Vipengele vya ziada\nUwezo wa kuunganisha spika mbili pamoja na maikrofoni ya kupigia simu ni faida.\n\n# Hukumu\nKwa matumizi ya nje, chagua spika inayostahimili maji na yenye betri ya saa nyingi. Kwa nyumbani, ubora wa sauti ndio kipaumbele."}, {"cat": "Gadgets & Reviews", "title": "Kibodi na panya kwa kazi za ofisini: mwongozo wa haraka", "body": "Kama unaandika au unafanya kazi kwenye kompyuta kwa saa nyingi, kibodi na panya nzuri zinaweza kuboresha ufanisi na kulinda mikono yako.\n\n# Kibodi\n- Kibodi isiyotumia waya hupunguza nyaya mezani.\n- Funguo zenye mwendo laini na kelele ndogo zinafaa ofisini.\n- Kibodi za mitambo (mechanical) ni imara na za starehe, ingawa zina kelele zaidi.\n\n# Panya\n- Umbo linalotosha mkono wako ni muhimu kuliko bei.\n- Panya ya USB receiver au Bluetooth hufanya kazi vizuri.\n- Kwa kazi za usanifu, chagua panya yenye usahihi mzuri.\n\n# Afya ya mikono\nWeka mikono sawa na meza, pumzika kila saa moja na nyoosha vidole.\n\n# Hukumu\nSeti ya kibodi na panya isiyotumia waya ya chapa inayojulikana ni uwekezaji mdogo wenye faida kubwa."}, {"cat": "Tips & Tutorials", "title": "Jinsi ya kuunda nenosiri imara na kulikumbuka", "body": "Nenosiri dhaifu ndilo mlango rahisi zaidi wa wahalifu. Habari njema ni kwamba kutengeneza nenosiri imara si ngumu.\n\n# Kanuni za nenosiri imara\n- Urefu: angalau herufi 12.\n- Mchanganyiko wa herufi kubwa, ndogo, namba na alama.\n- Usitumie jina lako, tarehe ya kuzaliwa au 123456.\n- Nenosiri tofauti kwa kila akaunti.\n\n# Njia rahisi ya kukumbuka\nTumia sentensi ndefu (passphrase) ya maneno kadhaa, mfano: Mvua-Inanyesha-Kila-Jioni-2026! Ni ndefu, ni rahisi kukumbuka na ni vigumu kubashiri. (Usitumie mfano huu halisi, tengeneza wako.)\n\n# Tumia kidhibiti cha manenosiri\nProgramu kama Bitwarden au kidhibiti kilichojengwa kwenye simu yako hukumbuka manenosiri yote, na wewe unakumbuka moja tu kuu.\n\n# Usifanye hivi\nUsishiriki nenosiri lako kwenye WhatsApp wala kuliandika kwenye karatasi iliyo wazi."}, {"cat": "Tips & Tutorials", "title": "Washa uthibitishaji wa hatua mbili (2FA) kwenye akaunti zako", "body": "Hata nenosiri likiibiwa, uthibitishaji wa hatua mbili (2FA) huzuia mhalifu kuingia kwenye akaunti yako kwa sababu huhitaji hatua ya ziada.\n\n# Hatua za jumla\n1. Fungua mipangilio ya usalama ya akaunti (Google, WhatsApp, Facebook, benki n.k.).\n2. Tafuta \"Uthibitishaji wa hatua mbili\" au \"Two-step verification\".\n3. Chagua njia: programu ya uthibitishaji (Authenticator) ni salama kuliko SMS.\n4. Hifadhi misimbo ya akiba (backup codes) mahali salama.\n\n# WhatsApp\nNenda kwenye Mipangilio, kisha Akaunti, kisha Uthibitishaji wa hatua mbili, na uweke PIN ya tarakimu 6.\n\n# Kumbuka\nUsimwambie mtu yeyote misimbo inayotumwa kwako, hata akijifanya ni mfanyakazi wa kampuni."}, {"cat": "Tips & Tutorials", "title": "Mbinu 8 za kuokoa betri ya simu yako", "body": "Betri inayoisha haraka ni kero ya kila siku. Mbinu hizi rahisi zinaweza kukuongezea masaa ya matumizi.\n\n# Mbinu 8\n1. Punguza mwanga wa skrini au tumia mwanga otomatiki.\n2. Washa hali ya kuokoa betri (battery saver) inapohitajika.\n3. Funga programu zisizotumika zinazokula betri nyuma.\n4. Zima Bluetooth, GPS na WiFi usipozitumia.\n5. Tumia hali ya giza (dark mode) kama skrini yako ni ya AMOLED.\n6. Punguza arifa zisizo za lazima.\n7. Sasisha programu na mfumo wa simu mara kwa mara.\n8. Epuka joto kali, na usiache simu ikichaji kwenye jua.\n\n# Angalia mkosaji\nFungua Mipangilio, kisha Betri, uone programu inayotumia betri nyingi zaidi. Mara nyingi ni programu moja au mbili tu.\n\nKama betri bado inaisha haraka licha ya hayo yote, huenda betri imechoka na inahitaji kubadilishwa na fundi anayeaminika."}, {"cat": "Tips & Tutorials", "title": "Hifadhi nakala (backup) ya picha na mafaili muhimu", "body": "Simu inaweza kupotea, kuibiwa au kuharibika. Bila nakala, picha na hati zako zinaweza kupotea milele.\n\n# Kanuni ya 3-2-1\n- Nakala 3 za data yako.\n- Kwenye aina 2 tofauti za hifadhi.\n- Moja iwe mahali pengine (kama wingu).\n\n# Hatua rahisi\n1. Washa hifadhi ya picha ya wingu (kwa mfano Google Photos).\n2. Hamisha mafaili muhimu kwenye kompyuta au diski ya nje kila mwezi.\n3. Hifadhi hati muhimu (vyeti, vitambulisho) kwenye wingu kwa usalama na nenosiri.\n4. Jaribu kurejesha faili moja ili kuhakikisha nakala inafanya kazi.\n\n# Kumbuka\nWingu lina nafasi ndogo ya bure, hivyo panga kufuta picha zisizohitajika mara kwa mara."}, {"cat": "Tips & Tutorials", "title": "Simu imekuwa polepole? Njia za kuirudishia kasi", "body": "Simu nyingi hupungua kasi baada ya muda, lakini mara nyingi unaweza kuirekebisha mwenyewe bila gharama.\n\n# Hatua za kujaribu\n1. Zima simu kisha iwashe upya.\n2. Futa programu usizotumia.\n3. Futa faili za muda (cache) na faili kubwa zisizohitajika.\n4. Acha angalau asilimia 15 hadi 20 ya hifadhi ikiwa wazi.\n5. Sasisha mfumo na programu zote.\n6. Punguza wijeti na mandhari hai (live wallpapers).\n7. Angalia programu zinazotumia nguvu nyingi nyuma ya pazia.\n\n# Hatua ya mwisho\nIkiwa bado ni polepole, hifadhi nakala ya data yako kisha rudisha simu kwenye mipangilio ya kiwandani (factory reset). Hii hufuta kila kitu, kwa hiyo hakikisha una nakala kwanza.\n\nSimu ya zamani sana huenda isiweze kuendesha programu mpya vizuri, na hapo kubadilisha simu kunakuwa suluhisho la mwisho."}, {"cat": "Tips & Tutorials", "title": "Ongeza kasi ya WiFi nyumbani kwa hatua rahisi", "body": "Kabla ya kulaumu mtoa huduma wako, jaribu hatua hizi rahisi za kuboresha WiFi nyumbani.\n\n# Hatua\n1. Weka router katikati ya nyumba na juu kidogo, mbali na kuta nene.\n2. Izime router kwa sekunde 30 kisha iwashe upya.\n3. Tumia bendi ya 5GHz ukiwa karibu na router, na 2.4GHz ukiwa mbali.\n4. Badilisha chaneli ya WiFi kama majirani wengi wanatumia chaneli ileile.\n5. Sasisha firmware ya router.\n6. Tenganisha vifaa visivyotumika au vinavyopakua vitu nyuma ya pazia.\n7. Kwa nyumba kubwa, tumia kirefusha (extender) au mfumo wa mesh.\n\n# Pima kasi\nPima kasi kabla na baada ya mabadiliko ukitumia tovuti ya kupima kasi, ili ujue kama kweli imesaidia.\n\nKama kasi ni ndogo hata ukiwa karibu na router kwa kutumia waya, tatizo huenda liko kwa mtoa huduma wako."}, {"cat": "Tips & Tutorials", "title": "Jinsi ya kutambua ujumbe wa ulaghai (phishing)", "body": "Ulaghai wa ujumbe (phishing) hujaribu kukuhadaa utoe nenosiri, PIN au pesa. Unaweza kuutambua kwa ishara chache.\n\n# Ishara za hatari\n- Shinikizo la haraka: \"Akaunti yako itafungwa leo!\"\n- Mtumaji asiyejulikana au anayejifanya kampuni, benki au mtoa huduma.\n- Kiungo (link) cha ajabu au kilichofupishwa.\n- Ombi la nenosiri, PIN au msimbo wa uthibitisho.\n- Ahadi za zawadi au pesa ambazo hujashiriki kuzipata.\n- Makosa mengi ya tahajia.\n\n# Cha kufanya\n1. Usibofye kiungo wala kupakua kiambatisho.\n2. Thibitisha kwa kupiga namba rasmi ya kampuni.\n3. Zuia mtumaji na uripoti ujumbe.\n4. Ukishabofya na kutoa taarifa, badilisha nenosiri haraka na uwasiliane na mtoa huduma wako.\n\nKumbuka: kampuni halali hazikuombi PIN au nenosiri lako kupitia ujumbe."}, {"cat": "Tips & Tutorials", "title": "Njia za mkato za kibodi zinazokuokolea muda (Windows)", "body": "Njia za mkato za kibodi (keyboard shortcuts) hukuokolea muda mwingi unapofanya kazi kwenye kompyuta. Hizi ndizo za msingi.\n\n# Za kila siku\n- Ctrl + C: nakili\n- Ctrl + X: kata\n- Ctrl + V: bandika\n- Ctrl + Z: tendua\n- Ctrl + Y: rudia\n- Ctrl + A: chagua vyote\n- Ctrl + F: tafuta kwenye ukurasa\n- Ctrl + S: hifadhi\n\n# Kuhamia na kupanga madirisha\n- Alt + Tab: badilisha kati ya programu\n- Windows + D: onyesha desktop\n- Windows + L: funga kompyuta (lock)\n- Windows + Shift + S: piga picha ya sehemu ya skrini\n\n# Kwenye kivinjari\n- Ctrl + T: kichupo kipya\n- Ctrl + W: funga kichupo\n- Ctrl + Shift + T: fungua tena kichupo ulichokifunga\n\nJifunze mbili au tatu kwa wiki, na hivi karibuni zitakuwa mazoea."}, {"cat": "Tips & Tutorials", "title": "Andika ukurasa wako wa kwanza wa HTML", "body": "HTML ni lugha ya msingi ya kutengeneza kurasa za wavuti. Huhitaji kompyuta ya gharama wala programu maalum, Notepad inatosha.\n\n# Hatua\n1. Fungua Notepad au kihariri cha msimbo kama VS Code.\n2. Nakili msimbo ulio hapa chini.\n3. Hifadhi faili kwa jina index.html.\n4. Bofya mara mbili faili hiyo ili ifunguke kwenye kivinjari.\n\n```\n<!DOCTYPE html>\n<html lang=\"sw\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Ukurasa Wangu<\/title>\n<\/head>\n<body>\n  <h1>Karibu!<\/h1>\n  <p>Huu ni ukurasa wangu wa kwanza wa wavuti.<\/p>\n  <a href=\"https://example.com\">Tembelea tovuti<\/a>\n<\/body>\n<\/html>\n```\n\n# Maana ya vipengele\n- h1 ni kichwa kikuu cha ukurasa.\n- p ni aya ya maandishi.\n- a ni kiungo kinachompeleka mtu kwenye ukurasa mwingine.\n\nBadilisha maneno, hifadhi, na uonyeshe upya kivinjari ili uone matokeo. Hatua inayofuata ni kujifunza CSS ili kupamba ukurasa wako."}, {"cat": "Tips & Tutorials", "title": "Tumia wingu (Google Drive) kupanga mafaili yako vizuri", "body": "Wingu kama Google Drive hukuwezesha kufikia mafaili yako kutoka kwenye simu au kompyuta yoyote, na kuyashiriki na wengine kwa urahisi.\n\n# Panga kwa utaratibu\n- Tengeneza folda kuu kwa mwaka au mradi, kisha folda ndogo ndani yake.\n- Tumia majina yanayoeleweka, mfano: 2026-03-Ripoti-Mauzo.\n- Weka tarehe mwanzoni mwa jina ili mafaili yapangike kwa mpangilio.\n\n# Shiriki kwa usalama\nUnaposhiriki faili, chagua ruhusa sahihi: Mtazamaji (viewer) kwa kusoma tu, au Mhariri (editor) kwa kubadilisha. Epuka kuweka \"mtu yeyote mwenye kiungo\" kwa hati nyeti.\n\n# Vidokezo vya ziada\n- Tumia kisanduku cha kutafuta kupata mafaili haraka.\n- Washa upatikanaji bila mtandao (offline) kwa mafaili unayoyahitaji safarini.\n- Futa mafaili yasiyohitajika na ukague tupio mara kwa mara.\n\nKupanga mafaili leo kunakuokolea muda mwingi baadaye."}];

document.addEventListener("touchend",e=>{if(e.touches.length<2)on=0},{passive:true});
addEventListener("hashchange",()=>R.style.removeProperty("--az"));
addEventListener("pageshow",()=>R.style.removeProperty("--az"));
})();
</script>
<script>
/* block selecting, copying, right-click and dragging outside typing fields */
(function(){const ok=t=>{t=t&&t.nodeType===3?t.parentElement:t;return!!(t&&t.closest&&t.closest('input,textarea,[contenteditable="true"],[contenteditable=""]'))};
const stop=e=>{if(e.cancelable)e.preventDefault()};
document.addEventListener("contextmenu",e=>{if(!ok(e.target))stop(e)});
["copy","cut","dragstart"].forEach(n=>document.addEventListener(n,e=>{if(!ok(e.target)&&!ok(document.activeElement))stop(e)}));
document.addEventListener("selectstart",e=>{if(!ok(e.target))stop(e)});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&/^[acxus]$/i.test(e.key)&&!ok(e.target)&&!ok(document.activeElement))stop(e)});
})();
</script>
</body>
</html>
